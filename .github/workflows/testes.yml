# Roda os testes da API e o build do site a cada push e pull request.
# Se algo quebrar (ex.: um restaurante enxergando dados de outro), o GitHub avisa antes do deploy.
name: Testes

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mesmo PostgreSQL 17 da produção (Neon) e do docker-compose do PC.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: movitech
          POSTGRES_PASSWORD: movitech
          POSTGRES_DB: restaurante_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U movitech -d restaurante_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://movitech:movitech@localhost:5433/restaurante_test
    defaults:
      run:
        working-directory: backendrestaurantetotal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backendrestaurantetotal/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m prisma generate
      - run: python -m pytest -q

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontrestaurantetotal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontrestaurantetotal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
