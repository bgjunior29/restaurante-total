# Renderiza os anúncios em HTML puro (videos/html/<video>) num servidor Linux e salva os MP4 nesta branch (videos/renders/).
# Usa a narração que já vem no commit (public/voz) e gera só a trilha. Mesmo pipeline do PC: render_html.mjs + montar_mp4.py,
# trocando o Opera GX pelo Chromium do Playwright.
# Roda a cada push na branch videos-render ou manualmente (Actions > Render vídeos > Run workflow).
name: Render vídeos

on:
  push:
    branches: [videos-render]
    paths: ['videos/**', '.github/workflows/render-videos.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: videos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: videos/package-lock.json

      - run: npm ci

      - name: Chromium do Playwright
        run: npx playwright-core install --with-deps chromium

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -q av numpy pillow

      - name: Trilha de fundo
        run: python scripts/gerar_trilha.py

      - name: Renderizar
        run: |
          node scripts/render_html.mjs movitech- nicho-
          mkdir -p renders
          for f in out/*.mp4; do cp "$f" "renders/lexmovi-$(basename "$f" | sed 's/^movitech-//')"; done
          ls -la renders

      - name: Salvar os MP4 nesta branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add -f renders/*.mp4
          git commit -m "Vídeos Lexmovi renderizados pelo GitHub Actions [skip ci]"
          git push
