# Renderiza os vídeos da Movi (Remotion) num servidor Linux e salva os MP4 de volta nesta branch (videos/renders/).
# Roda a cada push na branch videos-render ou manualmente (Actions > Render vídeos > Run workflow).
name: Render vídeos

on:
  push:
    branches: [videos-render]
    paths: ['videos/**', '.github/workflows/render-videos.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: videos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: videos/package-lock.json

      - name: Dependências do Chrome headless
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libasound2t64 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2 fonts-noto-color-emoji

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ffmpeg do sistema (para checar o áudio)
        run: sudo apt-get install -y -q ffmpeg

      # Thalita (voz feminina, edge-tts). Se o serviço recusar, usa o Piper (voz masculina, local).
      - name: Narração
        run: |
          pip install -q edge-tts
          if python scripts/gerar_voz.py nicho-; then
            echo "VOZ=thalita" >> "$GITHUB_ENV"
          else
            echo "edge-tts recusou; usando Piper"
            pip install -q piper-tts
            mkdir -p models
            base=https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium
            curl -sL -o models/pt_BR-faber-medium.onnx "$base/pt_BR-faber-medium.onnx"
            curl -sL -o models/pt_BR-faber-medium.onnx.json "$base/pt_BR-faber-medium.onnx.json"
            python scripts/gerar_voz_piper.py nicho-
            echo "VOZ=piper" >> "$GITHUB_ENV"
          fi

      - name: Conferir que a narração tem som
        run: python scripts/checar_audio.py public/voz/nicho-*.mp3

      # O cardápio real (cardapio.json) não vai para o git; os vídeos de nicho não usam, mas o Root importa.
      - name: Cardápio vazio para o bundle
        run: test -f src/cardapio.json || echo '{"dishes":[],"colors":{}}' > src/cardapio.json

      - run: npx remotion browser ensure

      - name: Renderizar
        run: |
          mkdir -p renders
          for n in clinicas saloes imobiliarias autoescolas oficinas contabilidade petshops; do
            npx remotion render src/index.jsx "MGNicho-$n" "renders/movi-mg-nicho-$n.mp4" --log=error
          done
          ls -la renders

      - name: Salvar os MP4 nesta branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add -f renders/*.mp4 public/voz src/voz
          git commit -m "Vídeos de nicho renderizados pelo GitHub Actions (voz: $VOZ) [skip ci]"
          git push
