# Blueprint do Render: API (backendrestaurantetotal). O banco PostgreSQL fica no Neon (veja DATABASE_URL).
# No painel do Render: New → Blueprint → escolha este repositório.
services:
  - type: web
    name: restaurante-total-api
    runtime: python
    plan: free
    rootDir: backendrestaurantetotal
    buildCommand: bash render-build.sh
    startCommand: bash render-start.sh
    healthCheckPath: /api/health
    envVars:
      # Banco PostgreSQL no Neon (neon.tech): cole a connection string DIRETA (sem "-pooler"),
      # terminando em ?sslmode=require. O free do Render permite só 1 banco e expira em 30 dias.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false # senha do admin do restaurante de exemplo (só usada num banco vazio)
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false # senha do login /plataforma (só usada num banco vazio; sem ela o login não é criado)
      # Mesmo valor da variável ORIGIN_SECRET da Vercel: a API só aceita /api/* que chegue com esse segredo.
      # Defina PRIMEIRO na Vercel (e faça o deploy de lá); só depois aqui. Vazio = API aberta como antes.
      - key: ORIGIN_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://frontrestaurantetotal.vercel.app
      - key: PUBLIC_URL
        value: https://frontrestaurantetotal.vercel.app # base dos QR codes e dos links do WhatsApp
      # Guarda os binários do Prisma dentro do projeto, para o start achar o que o build baixou.
      - key: PRISMA_BINARY_CACHE_DIR
        value: /opt/render/project/src/backendrestaurantetotal/.prisma-cache
